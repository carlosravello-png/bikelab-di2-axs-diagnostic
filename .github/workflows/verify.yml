name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check_tree.mjs
      - run: node tools/build.mjs
      - run: git diff --exit-code dist/di2_tool.js
